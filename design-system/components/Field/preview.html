<!-- @dsCard group="Formulieren" height=230 subtitle="Veld, textarea met teller, kleine variant, foutstate" -->
<div style="padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;max-width:640px">
  <div><label class="label" for="f1">E-mail</label><input id="f1" class="field" placeholder="naam@voorbeeld.nl"></div>
  <div><label class="label" for="f2">Atleet-ID</label><input id="f2" class="field" value="i123456" aria-invalid="true"><div class="hint hint-error">Dit ID hoort niet bij een atleet van jou.</div></div>
  <div style="grid-column:1/-1"><label class="label" for="f3">Korte bio</label><textarea id="f3" class="field" rows="2">Klimmer, gravelrijder en al 12 jaar trainer in Utrecht.</textarea><div class="hint num" style="text-align:right">62 / 280</div></div>
  <div style="display:flex;gap:8px;align-items:center"><input class="field field-sm" value="90" style="width:64px"><span style="font-size:12px;color:var(--text-muted)">min</span><input class="field field-sm" value="95–100" style="width:80px"><span style="font-size:12px;color:var(--text-muted)">% FTP</span></div>
</div>
