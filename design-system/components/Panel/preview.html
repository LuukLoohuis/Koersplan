<!-- @dsCard group="Oppervlakken" height=250 subtitle="Kaart met titel en actie; variant met hoogtelijnen voor lege states en coachkaarten" -->
<div style="padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px">
  <section class="panel">
    <header class="panel-header"><h3>Vandaag</h3><div class="action"><button class="btn btn-sm btn-ghost">Waarom</button></div></header>
    <div class="panel-body">
      <div style="font:600 15px var(--font-sans)">Drempel 2×20</div>
      <div class="num" style="color:var(--text-muted);margin:4px 0 10px">1:30 · TSS 84 · IF 0,86</div>
      <div style="display:flex;gap:3px;height:28px;align-items:flex-end">
        <span style="flex:2;height:40%;background:var(--zone-2);border-radius:3px"></span><span style="flex:3;height:85%;background:var(--zone-4);border-radius:3px"></span><span style="flex:1;height:35%;background:var(--zone-1);border-radius:3px"></span><span style="flex:3;height:85%;background:var(--zone-4);border-radius:3px"></span><span style="flex:2;height:30%;background:var(--zone-1);border-radius:3px"></span>
      </div>
    </div>
  </section>
  <section class="panel contour" style="display:grid;place-items:center;text-align:center;padding:24px">
    <div>
      <div style="font:700 18px var(--font-display);letter-spacing:-.01em">Rustdag</div>
      <div style="color:var(--text-muted);font-size:13px;margin-top:4px">Conditie kalibreert nog · 3 van 6 weken</div>
      <button class="btn btn-sm" style="margin-top:12px">Koppel Intervals.icu</button>
    </div>
  </section>
</div>
